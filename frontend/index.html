<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student ID Monitoring Sytem</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-screen overflow-hidden bg-slate-50">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL MOCK DATA ---
    const INITIAL_STUDENTS = [
      { id: '1', studentId: '2026-00101', name: 'Maria Santos', email: 'm.santos@zppsu.edu.ph', course: 'BSIT', department: 'College of Computing Studies', status: 'Active', dateRegistered: '2026-01-15', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
      { id: '2', studentId: '2026-00102', name: 'Juan Dela Cruz', email: 'j.delacruz@zppsu.edu.ph', course: 'BSCS', department: 'College of Computing Studies', status: 'Active', dateRegistered: '2026-01-16', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
      { id: '3', studentId: '2026-00103', name: 'Angelica Flores', email: 'a.flores@zppsu.edu.ph', course: 'BSED', department: 'College of Teacher Education', status: 'Pending', dateRegistered: '2026-02-01', avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150' },
      { id: '4', studentId: '2026-00104', name: 'Christian Reyes', email: 'c.reyes@zppsu.edu.ph', course: 'BSME', department: 'College of Engineering', status: 'Active', dateRegistered: '2026-02-10', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150' },
      { id: '5', studentId: '2026-00105', name: 'Bea Alonzo', email: 'b.alonzo@zppsu.edu.ph', course: 'BSHM', department: 'College of Hospitality', status: 'Inactive', dateRegistered: '2026-02-12', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' },
    ];

    const INITIAL_ACTIVITY = [
      { id: 1, name: 'Juan Dela Cruz', idNum: '2026-00102', action: 'Time-In Gate 1', time: '10 mins ago', type: 'in' },
      { id: 2, name: 'Maria Santos', idNum: '2026-00101', action: 'Time-In Gate 1', time: '25 mins ago', type: 'in' },
      { id: 3, name: 'Christian Reyes', idNum: '2026-00104', action: 'Time-Out Gate 2', time: '1 hour ago', type: 'out' },
    ];

    const INITIAL_ATTENDANCE = [
      { id: 'att-1', studentId: '2026-00101', name: 'Maria Santos', department: 'College of Computing Studies', date: '2026-10-16', timeIn: '07:45 AM', timeOut: '04:30 PM', status: 'Present' },
      { id: 'att-2', studentId: '2026-00102', name: 'Juan Dela Cruz', department: 'College of Computing Studies', date: '2026-10-16', timeIn: '08:02 AM', timeOut: '---', status: 'Present' },
      { id: 'att-3', studentId: '2026-00104', name: 'Christian Reyes', department: 'College of Engineering', date: '2026-10-16', timeIn: '08:15 AM', timeOut: '12:00 PM', status: 'Present' },
    ];

    // Main App Component
    function App() {
      // Auth State
      const [user, setUser] = useState({ loggedIn: true, name: 'Admin user', role: 'Admin account', initials: 'AD' });
      
      // Data States
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [activities, setActivities] = useState(INITIAL_ACTIVITY);
      const [attendanceLogs, setAttendanceLogs] = useState(INITIAL_ATTENDANCE);
      
      // UI States
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [showAddModal, setShowAddModal] = useState(false);
      const [notification, setNotification] = useState(null);

      // Attendance Form State
      const [selectedStudentForAtt, setSelectedStudentForAtt] = useState('');
      const [attStatus, setAttStatus] = useState('Present');
      const [scannerInput, setScannerInput] = useState('');

      // Auto Render Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Show toast alert
      const triggerNotify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      // Filtered Students
      const filteredStudents = useMemo(() => {
        return students.filter(st => {
          const matchesSearch = st.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                st.studentId.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                st.course.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                st.department.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesStatus = statusFilter === 'All' || st.status.toLowerCase() === statusFilter.toLowerCase();
          return matchesSearch && matchesStatus;
        });
      }, [students, searchQuery, statusFilter]);

      // Metrics Computation
      const totalStudents = students.length;
      const activeIDs = students.filter(s => s.status === 'Active').length;
      const pendingIDs = students.filter(s => s.status === 'Pending').length;
      const todayAttendance = attendanceLogs.length;

      // Handle Quick Attendance Save
      const handleSaveAttendance = (e) => {
        if (e) e.preventDefault();
        const stId = selectedStudentForAtt || scannerInput;
        if (!stId) {
          triggerNotify('Please select a student or enter Student ID', 'error');
          return;
        }

        const found = students.find(s => s.id === stId || s.studentId.toLowerCase() === stId.toLowerCase());
        if (!found) {
          triggerNotify('Student not found!', 'error');
          return;
        }

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        // Add to attendance log
        const newLog = {
          id: 'att-' + Date.now(),
          studentId: found.studentId,
          name: found.name,
          department: found.department,
          date: now.toISOString().split('T')[0],
          timeIn: timeStr,
          timeOut: '---',
          status: attStatus
        };

        setAttendanceLogs([newLog, ...attendanceLogs]);
        
        // Add to activity stream
        const newAct = {
          id: Date.now(),
          name: found.name,
          idNum: found.studentId,
          action: `Scanned (${attStatus})`,
          time: 'Just now',
          type: 'in'
        };
        setActivities([newAct, ...activities]);

        triggerNotify(`Recorded attendance for ${found.name}`);
        setSelectedStudentForAtt('');
        setScannerInput('');
      };

      // Export CSV Function
      const handleExportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Student ID,Name,Course,Department,Status,Date Registered\n";
        
        filteredStudents.forEach(st => {
          csvContent += `"${st.studentId}","${st.name}","${st.course}","${st.department}","${st.status}","${st.dateRegistered}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `student_records_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerNotify("CSV file downloaded successfully!");
      };

      // Delete Student
      const handleDeleteStudent = (id) => {
        if (confirm("Are you sure you want to delete this student record?")) {
          setStudents(students.filter(s => s.id !== id));
          triggerNotify("Student record deleted.");
        }
      };

      if (!user.loggedIn) {
        return <LoginScreen onLogin={(userObj) => setUser({ ...userObj, loggedIn: true })} />;
      }

      return (
        <div className="flex h-screen bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden">
          
          {/* TOAST NOTIFICATION */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-2 animate-bounce ${
              notification.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
            }`}>
              <i data-lucide={notification.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-5 h-5"></i>
              {notification.msg}
            </div>
          )}

          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-white border-r border-slate-200/80 flex flex-col justify-between flex-shrink-0">
            <div>
              {/* Logo Header */}
              <div className="p-6 flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-brand-600 text-white font-bold text-xl flex items-center justify-center shadow-md shadow-brand-500/20">
                  S
                </div>
                <div className="flex flex-col">
                  <span className="font-bold text-slate-900 tracking-tight text-base leading-tight">STUDENT<span className="text-brand-600">MONITORING</span></span>
                  <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">System Portal</span>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="px-3 space-y-1">
                <div className="px-3 pt-2 pb-1 text-[11px] font-semibold text-slate-400 tracking-wider uppercase">
                  MAIN MENU
                </div>

                {[
                  { name: 'Dashboard', icon: 'layout-dashboard' },
                  { name: 'Students', icon: 'users' },
                  { name: 'Attendance', icon: 'clock' },
                  { name: 'ID Monitoring', icon: 'id-card' },
                  { name: 'Reports', icon: 'file-text' },
                  { name: 'Settings', icon: 'settings' },
                ].map((item) => {
                  const isActive = activeTab === item.name;
                  return (
                    <button
                      key={item.name}
                      onClick={() => setActiveTab(item.name)}
                      className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 ${
                        isActive
                          ? 'bg-brand-50 text-brand-600 font-semibold shadow-sm'
                          : 'text-slate-600 hover:bg-slate-100/80 hover:text-slate-900'
                      }`}
                    >
                      <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-brand-600' : 'text-slate-400'}`}></i>
                      {item.name}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Sidebar Bottom User Action */}
            <div className="p-4 border-t border-slate-100">
              <button 
                onClick={() => setUser({ ...user, loggedIn: false })}
                className="w-full flex items-center gap-3 px-3 py-2 text-sm font-medium text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
              >
                <i data-lucide="log-out" className="w-4 h-4"></i>
                Sign Out
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            {/* TOP HEADER */}
            <header className="h-16 bg-white border-b border-slate-200/80 flex items-center justify-between px-8 flex-shrink-0">
              {/* Search input */}
              <div className="relative w-96">
                <i data-lucide="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search students, ID number..."
                  className="w-full bg-slate-100/70 border border-transparent focus:border-brand-500 focus:bg-white rounded-xl pl-10 pr-4 py-2 text-sm text-slate-700 placeholder-slate-400 outline-none transition-all"
                />
              </div>

              {/* Profile info */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <span className="text-sm text-slate-600 font-medium">{user.role}</span>
                </div>
                <div className="w-9 h-9 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center border border-slate-300">
                  {user.initials}
                </div>
              </div>
            </header>

            {/* PAGE BODY (SCROLLABLE) */}
            <main className="flex-1 overflow-y-auto p-8 space-y-6">
              
              {/* OVERVIEW TITLE HEADER */}
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-xs font-bold tracking-wider text-brand-600 uppercase">OVERVIEW</span>
                  <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight mt-0.5">
                    Student ID Monitoring <span className="text-brand-600">SYSTEM</span>
                  </h1>
                  <p className="text-sm text-slate-500">Manage student records, ID status, and attendance in one place.</p>
                </div>

                <button
                  onClick={() => setShowAddModal(true)}
                  className="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-4 py-2.5 rounded-xl shadow-md shadow-brand-600/20 transition-all hover:scale-[1.01] active:scale-[0.99]"
                >
                  <i data-lucide="plus" className="w-4 h-4"></i>
                  Add Student
                </button>
              </div>

              {/* SUMMARY STATS GRID (4 Cards) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {/* Card 1 */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="users" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <span className="text-xs font-medium text-slate-400 block">Total Students</span>
                    <span className="text-2xl font-bold text-slate-900 leading-none my-0.5 block">{totalStudents}</span>
                    <span className="text-[11px] text-slate-400 block">Registered student records</span>
                  </div>
                </div>

                {/* Card 2 */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="check-circle" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <span className="text-xs font-medium text-slate-400 block">Active IDs</span>
                    <span className="text-2xl font-bold text-slate-900 leading-none my-0.5 block">{activeIDs}</span>
                    <span className="text-[11px] text-slate-400 block">IDs currently active</span>
                  </div>
                </div>

                {/* Card 3 */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="clock" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <span className="text-xs font-medium text-slate-400 block">Pending IDs</span>
                    <span className="text-2xl font-bold text-slate-900 leading-none my-0.5 block">{pendingIDs}</span>
                    <span className="text-[11px] text-slate-400 block">Awaiting ID issuance</span>
                  </div>
                </div>

                {/* Card 4 */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="clipboard-list" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <span className="text-xs font-medium text-slate-400 block">Today's Attendance</span>
                    <span className="text-2xl font-bold text-slate-900 leading-none my-0.5 block">{todayAttendance}</span>
                    <span className="text-[11px] text-slate-400 block">Students marked present</span>
                  </div>
                </div>
              </div>

              {/* MAIN CONTENT BASED ON TAB */}
              {activeTab === 'Dashboard' && (
                <>
                  {/* STUDENT RECORDS TABLE SECTION */}
                  <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div className="p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900">Student Records</h2>
                        <p className="text-xs text-slate-500">View and manage registered student information.</p>
                      </div>

                      <div className="flex items-center gap-3">
                        <select
                          value={statusFilter}
                          onChange={(e) => setStatusFilter(e.target.value)}
                          className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-700 outline-none focus:border-brand-500"
                        >
                          <option value="All">All ID statuses</option>
                          <option value="Active">Active</option>
                          <option value="Pending">Pending</option>
                          <option value="Inactive">Inactive</option>
                        </select>

                        <button
                          onClick={handleExportCSV}
                          className="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs px-3.5 py-2 rounded-xl transition-colors"
                        >
                          <i data-lucide="download" className="w-3.5 h-3.5"></i>
                          Export CSV
                        </button>
                      </div>
                    </div>

                    {/* Table View */}
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-slate-50/70 border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                            <th className="py-3 px-6">STUDENT</th>
                            <th className="py-3 px-6">STUDENT ID</th>
                            <th className="py-3 px-6">COURSE / GRADE</th>
                            <th className="py-3 px-6">DEPARTMENT</th>
                            <th className="py-3 px-6">ID STATUS</th>
                            <th className="py-3 px-6">DATE REGISTERED</th>
                            <th className="py-3 px-6 text-right">ACTIONS</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-sm">
                          {filteredStudents.length === 0 ? (
                            <tr>
                              <td colSpan="7" className="py-8 text-center text-slate-400 text-xs">
                                Showing 0 records
                              </td>
                            </tr>
                          ) : (
                            filteredStudents.map((st) => (
                              <tr key={st.id} className="hover:bg-slate-50/50 transition-colors">
                                <td className="py-3.5 px-6">
                                  <div className="flex items-center gap-3">
                                    <img src={st.avatar} className="w-8 h-8 rounded-full object-cover border border-slate-200" />
                                    <div>
                                      <div className="font-semibold text-slate-800 text-xs">{st.name}</div>
                                      <div className="text-[11px] text-slate-400">{st.email}</div>
                                    </div>
                                  </div>
                                </td>
                                <td className="py-3.5 px-6 font-mono text-xs font-semibold text-slate-700">{st.studentId}</td>
                                <td className="py-3.5 px-6 text-xs text-slate-600">{st.course}</td>
                                <td className="py-3.5 px-6 text-xs text-slate-600">{st.department}</td>
                                <td className="py-3.5 px-6">
                                  <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${
                                    st.status === 'Active' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' :
                                    st.status === 'Pending' ? 'bg-amber-50 text-amber-600 border border-amber-200' :
                                    'bg-slate-100 text-slate-500 border border-slate-200'
                                  }`}>
                                    {st.status}
                                  </span>
                                </td>
                                <td className="py-3.5 px-6 text-xs text-slate-500">{st.dateRegistered}</td>
                                <td className="py-3.5 px-6 text-right space-x-2">
                                  <button 
                                    onClick={() => handleDeleteStudent(st.id)}
                                    className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                    title="Delete Student"
                                  >
                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                  </button>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>

                    <div className="px-6 py-3 bg-slate-50/50 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                      <span>Showing {filteredStudents.length} of {students.length} records</span>
                      <span>Student ID Monitoring System</span>
                    </div>
                  </div>

                  {/* BOTTOM SPLIT SECTION */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    {/* Left Card: Attendance Overview */}
                    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
                      <div className="mb-5">
                        <h3 className="text-base font-bold text-slate-900">Attendance Overview</h3>
                        <p className="text-xs text-slate-500">Record attendance for today.</p>
                      </div>

                      <form onSubmit={handleSaveAttendance} className="space-y-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">Select Student</label>
                          <select
                            value={selectedStudentForAtt}
                            onChange={(e) => setSelectedStudentForAtt(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 outline-none focus:border-brand-500"
                          >
                            <option value="">Select a student</option>
                            {students.map(s => (
                              <option key={s.id} value={s.id}>{s.name} ({s.studentId})</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">Or Quick ID Input / Scanner Tap</label>
                          <input
                            type="text"
                            placeholder="Type student ID (e.g. 2026-00101)..."
                            value={scannerInput}
                            onChange={(e) => setScannerInput(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 outline-none focus:border-brand-500 font-mono"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">Status</label>
                          <select
                            value={attStatus}
                            onChange={(e) => setAttStatus(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 outline-none focus:border-brand-500"
                          >
                            <option value="Present">Present</option>
                            <option value="Late">Late</option>
                            <option value="Absent">Absent</option>
                            <option value="Time-In">Time-In</option>
                            <option value="Time-Out">Time-Out</option>
                          </select>
                        </div>

                        <button
                          type="submit"
                          className="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs py-3 rounded-xl shadow-md shadow-brand-600/20 transition-all mt-2"
                        >
                          Save Attendance
                        </button>
                      </form>
                    </div>

                    {/* Right Card: Recent ID Activity */}
                    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 flex flex-col justify-between">
                      <div>
                        <div className="mb-4">
                          <h3 className="text-base font-bold text-slate-900">Recent ID Activity</h3>
                          <p className="text-xs text-slate-500">Latest student ID updates.</p>
                        </div>

                        <div className="space-y-3">
                          {activities.slice(0, 4).map((act) => (
                            <div key={act.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50/70 border border-slate-100">
                              <div className="flex items-center gap-3">
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                                  act.type === 'in' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                                }`}>
                                  <i data-lucide={act.type === 'in' ? 'arrow-down-left' : 'arrow-up-right'} className="w-4 h-4"></i>
                                </div>
                                <div>
                                  <div className="text-xs font-bold text-slate-800">{act.name}</div>
                                  <div className="text-[10px] text-slate-400 font-mono">{act.idNum} • {act.action}</div>
                                </div>
                              </div>
                              <span className="text-[10px] font-medium text-slate-400">{act.time}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="pt-4 mt-4 border-t border-slate-100 text-center">
                        <button 
                          onClick={() => setActiveTab('Attendance')}
                          className="text-xs font-medium text-brand-600 hover:text-brand-700"
                        >
                          View full attendance log →
                        </button>
                      </div>
                    </div>

                  </div>
                </>
              )}

              {/* STUDENTS TAB */}
              {activeTab === 'Students' && (
                <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900">All Registered Students</h2>
                      <p className="text-xs text-slate-500">Complete student directory & ID status control.</p>
                    </div>
                    <button
                      onClick={() => setShowAddModal(true)}
                      className="bg-brand-600 text-white font-medium text-xs px-3.5 py-2 rounded-xl"
                    >
                      + Add New Student
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b text-[11px] font-bold text-slate-400 uppercase">
                          <th className="py-2 px-4">Student</th>
                          <th className="py-2 px-4">ID Number</th>
                          <th className="py-2 px-4">Course</th>
                          <th className="py-2 px-4">Department</th>
                          <th className="py-2 px-4">Status</th>
                          <th className="py-2 px-4">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y text-xs text-slate-700">
                        {filteredStudents.map(s => (
                          <tr key={s.id} className="hover:bg-slate-50">
                            <td className="py-3 px-4 font-semibold">{s.name}</td>
                            <td className="py-3 px-4 font-mono">{s.studentId}</td>
                            <td className="py-3 px-4">{s.course}</td>
                            <td className="py-3 px-4">{s.department}</td>
                            <td className="py-3 px-4">{s.status}</td>
                            <td className="py-3 px-4">
                              <button onClick={() => handleDeleteStudent(s.id)} className="text-red-500 font-medium">Delete</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* ATTENDANCE TAB */}
              {activeTab === 'Attendance' && (
                <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900">Attendance Scan Logs</h2>
                      <p className="text-xs text-slate-500">Real-time gate scans and manually entered records.</p>
                    </div>
                    <button onClick={handleExportCSV} className="bg-slate-100 text-slate-700 font-medium text-xs px-3 py-2 rounded-xl">
                      Download CSV
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b text-[11px] font-bold text-slate-400 uppercase">
                          <th className="py-2 px-4">Student</th>
                          <th className="py-2 px-4">ID Number</th>
                          <th className="py-2 px-4">Department</th>
                          <th className="py-2 px-4">Date</th>
                          <th className="py-2 px-4">Time In</th>
                          <th className="py-2 px-4">Time Out</th>
                          <th className="py-2 px-4">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y text-xs text-slate-700">
                        {attendanceLogs.map(log => (
                          <tr key={log.id} className="hover:bg-slate-50">
                            <td className="py-3 px-4 font-semibold">{log.name}</td>
                            <td className="py-3 px-4 font-mono">{log.studentId}</td>
                            <td className="py-3 px-4">{log.department}</td>
                            <td className="py-3 px-4">{log.date}</td>
                            <td className="py-3 px-4">{log.timeIn}</td>
                            <td className="py-3 px-4">{log.timeOut}</td>
                            <td className="py-3 px-4"><span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-600 font-medium">{log.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* OTHER TABS PLACEHOLDER */}
              {(activeTab === 'ID Monitoring' || activeTab === 'Reports' || activeTab === 'Settings') && (
                <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-12 text-center">
                  <i data-lucide="layers" className="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                  <h3 className="text-base font-bold text-slate-800">{activeTab} Module</h3>
                  <p className="text-xs text-slate-400 mt-1 max-w-sm mx-auto">
                    This section contains dedicated controls and settings for {activeTab.toLowerCase()}. All core student ID tracking systems are operational.
                  </p>
                </div>
              )}

            </main>
          </div>

          {/* ADD STUDENT MODAL */}
          {showAddModal && (
            <AddStudentModal
              onClose={() => setShowAddModal(false)}
              onAdd={(newSt) => {
                setStudents([newSt, ...students]);
                setShowAddModal(false);
                triggerNotify("New student registered successfully!");
              }}
            />
          )}

        </div>
      );
    }

    // ADD STUDENT MODAL COMPONENT
    function AddStudentModal({ onClose, onAdd }) {
      const [formData, setFormData] = useState({
        name: '',
        studentId: '',
        course: '',
        department: 'College of Computing Sciences',
        email: '',
        status: 'Active'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.studentId) return;

        onAdd({
          id: String(Date.now()),
          ...formData,
          dateRegistered: new Date().toISOString().split('T')[0],
          avatar: `https://images.unsplash.com/photo-${1500000000000 + Math.floor(Math.random()*100000)}?w=150`
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
            <div className="p-5 border-b border-slate-100 flex items-center justify-between">
              <h3 className="font-bold text-slate-900 text-base">Add New Student</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Juan Dela Cruz"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Student ID Number</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. 2026-00109"
                  value={formData.studentId}
                  onChange={(e) => setFormData({ ...formData, studentId: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 font-mono outline-none focus:border-brand-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Course</label>
                  <input
                    type="text"
                    placeholder="e.g. BSIT"
                    value={formData.course}
                    onChange={(e) => setFormData({ ...formData, course: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 outline-none focus:border-brand-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">ID Status</label>
                  <select
                    value={formData.status}
                    onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 outline-none focus:border-brand-500"
                  >
                    <option value="Active">Active</option>
                    <option value="Pending">Pending</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Department</label>
                <select
                  value={formData.department}
                  onChange={(e) => setFormData({ ...formData, department: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 outline-none focus:border-brand-500"
                >
                  <option value="College of Computing Studies">College of Information Computing Sciences</option>
                  <option value="College of Engineering">College of Engineering</option>
                  <option value="College of Teacher Education">College of Teacher Education</option>
                  <option value="College of Hospitality">College of Hospitality</option>
                </select>
              </div>

              <div className="pt-3 flex gap-2 justify-end">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 text-xs font-medium bg-brand-600 text-white rounded-xl hover:bg-brand-700 shadow-md shadow-brand-600/20"
                >
                  Save Record
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // LOGIN SCREEN COMPONENT
    function LoginScreen({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        onLogin({
          name: 'Administrator',
          role: 'Admin account',
          initials: 'AD'
        });
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-xl border border-slate-200/80 w-full max-w-md p-8">
            <div className="text-center mb-6">
              <div className="w-12 h-12 bg-brand-600 text-white rounded-2xl flex items-center justify-center text-2xl font-extrabold mx-auto mb-3 shadow-lg shadow-brand-500/30">
                S
              </div>
              <h2 className="text-xl font-bold text-slate-900">Student Monitoring System</h2>
              <p className="text-xs text-slate-500 mt-1">Sign in to access student ID dashboard</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Email / ID Number</label>
                <input
                  type="text"
                  required
                  placeholder="admin@zppsu.edu.ph"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 outline-none focus:border-brand-500"
                />
              </div>

              <button
                type="submit"
                className="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs py-3 rounded-xl shadow-md shadow-brand-600/20 transition-all"
              >
                Sign In to Dashboard
              </button>
            </form>

            <div className="mt-6 pt-5 border-t border-slate-100 text-center">
              <p className="text-[11px] text-slate-400 mb-2">Demo Quick Login:</p>
              <button
                onClick={() => onLogin({ name: 'Admin Account', role: 'Admin account', initials: 'AD' })}
                className="text-xs text-brand-600 font-semibold hover:underline"
              >
                Click here for instant Admin access
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
